name: Build Windows EXE

# Compila l'eseguibile Windows:
# - ad ogni tag "v*" (es. v1.0.0) e lo allega alla Release
# - manualmente dalla scheda Actions (workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Package (electron-packager)
        run: npm run pack:exe

      - name: Zip build
        run: Compress-Archive -Path "dist-app/*" -DestinationPath "LabelForge-win-x64.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelForge-win-x64
          path: LabelForge-win-x64.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LabelForge-win-x64.zip
